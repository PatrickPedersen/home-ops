---
connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m

endpoints:
  - name: Cloudflare
    group: connectivity
    url: icmp://1.1.1.1
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Google
    group: connectivity
    url: icmp://8.8.8.8
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Quad9
    group: connectivity
    url: icmp://9.9.9.9
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  # Its chart can't annotate the Service, so it's listed here.
  - name: flux-operator
    group: internal
    ui: { hide-hostname: true, hide-url: true }
    url: http://flux-operator.flux-system.svc.cluster.local:9080/
    interval: 1m
    conditions:
      - "[STATUS] == 200"

  - name: pangolin
    group: external
    url: https://pangolin.patrickpedersen.tech
    interval: 1m
    conditions:
      - "[STATUS] == 200"

metrics: true

storage:
  type: sqlite
  caching: true
  path: ${GATUS_CONFIG_PATH}/gatus.db

ui:
  title: Status | Gatus
  header: Status
  logo: https://avatars.githubusercontent.com/u/44923215
  link: https://github.com/patrickpedersen
  buttons:
    - name: Github
      link: https://github.com/patrickpedersen
    - name: Homelab
      link: https://github.com/patrickpedersen/home-ops

web:
  port: ${GATUS_WEB_PORT}
