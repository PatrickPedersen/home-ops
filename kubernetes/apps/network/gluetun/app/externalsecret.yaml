---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gluetun
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: gluetun-secret
    template:
      data:
        WIREGUARD_PRIVATE_KEY: "{{ .PROTONVPN_PRIVATE_KEY }}"
  dataFrom:
    - extract:
        # Own ProtonVPN WireGuard config: a key can't be shared with
        # qBittorrent's tunnel, the two would keep kicking each other off.
        key: gluetun
