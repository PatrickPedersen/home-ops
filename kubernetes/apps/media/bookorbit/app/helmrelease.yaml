---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bookorbit
spec:
  chartRef:
    kind: OCIRepository
    name: bookorbit
  interval: 1h
  values:
    controllers:
      bookorbit:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/bookorbit/bookorbit
              tag: 3.5.0@sha256:1534bc7d696179141875b0298ea7916be4469eb2eb9250347873eaaa9728b5a8
            env:
              TZ: Europe/Copenhagen
              PORT: &port 3000
              APP_URL: https://{{ .Release.Name }}.${SECRET_DOMAIN}
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: bookorbit-pg-app # generated by CloudNativePG
                    key: uri
              LIBRARY_BROWSE_ROOT: /books
              # auth.${SECRET_DOMAIN} may resolve to a private address in-cluster.
              OIDC_ALLOW_LOCAL_ISSUERS: "true"
            envFrom:
              - secretRef:
                  name: bookorbit-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 6
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 30 # runs DB migrations before listening
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 20m
              limits:
                memory: 2Gi
    defaultPodOptions:
      # Owner of the media share, so books written to /books match the rest.
      securityContext:
        runAsNonRoot: true
        runAsUser: 100000
        runAsGroup: 100000
        fsGroup: 100000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: openebs-hostpath
        accessMode: ReadWriteOnce
        size: 2Gi
        globalMounts:
          - path: /data
      books:
        existingClaim: media
        globalMounts:
          - path: /books
            subPath: books
          # qBittorrent's downloads (/data/torrents there), for importing.
          - path: /torrents
            subPath: torrents
      tmp:
        type: emptyDir
