---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookorbit
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: bookorbit-secret
    template:
      data:
        JWT_SECRET: "{{ .JWT_SECRET }}"
        SETUP_BOOTSTRAP_TOKEN: "{{ .SETUP_BOOTSTRAP_TOKEN }}"
        # Must stay the values the old install used: they decrypt stored SMTP
        # and migration-source credentials.
        EMAIL_ENCRYPTION_KEY: "{{ .EMAIL_ENCRYPTION_KEY }}"
        MIGRATION_ENCRYPTION_KEY: "{{ .MIGRATION_ENCRYPTION_KEY }}"
        BOOK_REQUEST_ENCRYPTION_KEY: "{{ .BOOK_REQUEST_ENCRYPTION_KEY }}"
  dataFrom:
    - extract:
        key: bookorbit
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookorbit-pg-backup
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: bookorbit-pg-backup
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .B2_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .B2_APPLICATION_KEY }}"
  dataFrom:
    - extract:
        key: backblaze
