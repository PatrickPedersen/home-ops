---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rdtclient
spec:
  chartRef:
    kind: OCIRepository
    name: rdtclient
  interval: 1h
  values:
    controllers:
      rdtclient:
        containers:
          app:
            # LinuxServer-style image: s6 starts as root, then drops to PUID/PGID.
            image:
              repository: ghcr.io/rogerfar/rdtclient
              tag: 2.0.142@sha256:647db1c0040b1b28bb0e874fd2b58e315c52004c0c27d24e0e0b9be7f6d92469
            env:
              TZ: Europe/Copenhagen
              PUID: "100000"
              PGID: "100000"
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 6500
                  periodSeconds: 10
                  failureThreshold: 6
              readiness: *probe
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      media:
        existingClaim: media
        globalMounts:
          - path: /data
      # rdtclient keeps its SQLite DB in /data/db. Mount local disk over that
      # path so the database never lives on NFS.
      db:
        type: persistentVolumeClaim
        storageClass: openebs-hostpath
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /data/db
