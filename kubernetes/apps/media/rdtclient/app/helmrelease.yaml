---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rdtclient
spec:
  chartRef:
    kind: OCIRepository
    name: rdtclient
  interval: 1h
  values:
    controllers:
      rdtclient:
        containers:
          app:
            # LinuxServer-style image: s6 starts as root, then drops to PUID/PGID.
            image:
              repository: ghcr.io/rogerfar/rdtclient
              tag: 2.0.143@sha256:68523637d09ec8a120bd272756d58b393448a656b5967bd45622c4891c65ff36
            env:
              TZ: Europe/Copenhagen
              PUID: "100000"
              PGID: "100000"
              # Otherwise every start runs `chown -R /data` over the whole NFS
              # media tree (already owned by 100000 via mapall); the liveness
              # probe kills it before that finishes.
              SKIP_CHOWN: "true"
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 6500
                  periodSeconds: 10
                  failureThreshold: 6
              readiness: *probe
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    service:
      app:
        # Real health check; see jellyfin for why the route isn't monitored.
        annotations:
          gatus.home-operations.com/enabled: "true"
          gatus.home-operations.com/endpoint: |-
            group: internal
            ui: { hide-hostname: true, hide-url: true }
            url: http://rdtclient.media.svc.cluster.local:6500/
            conditions: ["[STATUS] == 200"]
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      media:
        existingClaim: media
        globalMounts:
          - path: /data
      # rdtclient keeps its SQLite DB in /data/db. Mount local disk over that
      # path so the database never lives on NFS.
      db:
        type: persistentVolumeClaim
        storageClass: openebs-hostpath
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /data/db
