---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
# Every request to these routes is checked against Authentik's embedded
# outpost first (provider "Forward auth", group media_admin). The apps
# themselves run with AUTH__METHOD External.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: forward-auth
spec:
  targetRefs:
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: bazarr }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: prowlarr }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: radarr }
    - { group: gateway.networking.k8s.io, kind: HTTPRoute, name: sonarr }
  extAuth:
    # HTTP ext auth only forwards Host, Method, Path and Authorization by
    # default; Authentik needs the session cookie and the original scheme.
    headersToExtAuth:
      - accept
      - cookie
      - user-agent
      - x-forwarded-host
      - x-forwarded-proto
      - x-requested-with
    http:
      backendRefs:
        - name: authentik-server
          namespace: security
          port: 80
      path: /outpost.goauthentik.io/auth/envoy
      headersToBackend:
        - x-authentik-username
        - x-authentik-email
