---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mangarr
spec:
  chartRef:
    kind: OCIRepository
    name: mangarr
  interval: 1h
  values:
    controllers:
      mangarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/patrickpedersen/mangarr
              tag: sha-bc24160@sha256:0fc4b909e8ae7231c639a495506c302832f6a3a7f5f6fd6ade50d8e5b530d942
            env:
              TZ: Europe/Copenhagen
              PORT: &port 3000
              DATA_DIR: /data
              # BookOrbit scans /books; it ignores Mangarr's .mangarr-tmp staging dir.
              LIBRARY_DIR: /books/manhwa
              SUWAYOMI_URL: http://suwayomi.media.svc.cluster.local:4567
            envFrom:
              - secretRef:
                  name: mangarr-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 6
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 20m
              limits:
                memory: 1Gi # CBZ writes stream; peak measured ~110MB on a 4.7GB archive
    defaultPodOptions:
      # Owner of the media share, so CBZs written to /books match the rest.
      securityContext:
        runAsNonRoot: true
        runAsUser: 100000
        runAsGroup: 100000
        fsGroup: 100000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: openebs-hostpath
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /data
      books:
        existingClaim: media
        globalMounts:
          - path: /books
            subPath: books
