---
# Shared media + downloads tree. One volume so hardlinks/atomic moves work
# between torrents/ and media/. Served by TrueNAS (NFSv4, all_squash to
# 100000). The path is immutable: changing it means recreating PV and PVC.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-nfs
spec:
  capacity:
    storage: 1Mi # informational only for static NFS
  accessModes: ["ReadWriteMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: ["nfsvers=4.2", "nconnect=8", "hard", "noatime"]
  nfs:
    server: 192.168.40.2
    path: /mnt/vault/media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: ""
  volumeName: media-nfs
  resources:
    requests:
      storage: 1Mi
