---
# Shared media + downloads tree. One volume so hardlinks/atomic moves work
# between torrents/ and media/. After the TrueNAS switch only `path` changes
# (/vault/media -> /mnt/vault/media); the storage IP stays 192.168.40.2.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-nfs
spec:
  capacity:
    storage: 1Mi # informational only for static NFS
  accessModes: ["ReadWriteMany"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions: ["nfsvers=4.2", "nconnect=8", "hard", "noatime"]
  nfs:
    server: 192.168.40.2
    path: /vault/media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: ""
  volumeName: media-nfs
  resources:
    requests:
      storage: 1Mi
