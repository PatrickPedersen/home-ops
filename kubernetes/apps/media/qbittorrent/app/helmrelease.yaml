---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  chartRef:
    kind: OCIRepository
    name: qbittorrent
  interval: 1h
  values:
    controllers:
      qbittorrent:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Native sidecar: all pod traffic leaves through the ProtonVPN tunnel.
          # Gluetun's firewall drops anything else, so a VPN drop means no
          # traffic rather than a leak.
          gluetun:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
            env:
              VPN_SERVICE_PROVIDER: protonvpn
              VPN_TYPE: wireguard
              PORT_FORWARD_ONLY: "on"
              VPN_PORT_FORWARDING: "on"
              # Pushes the forwarded port into qBittorrent. Requires
              # "Bypass authentication for clients on localhost" in qBittorrent.
              # {{ "{{...}}" }} escapes Gluetun placeholders from the chart's templating.
              VPN_PORT_FORWARDING_UP_COMMAND: >-
                /bin/sh -c 'wget -O- -nv --retry-connrefused --post-data
                "json={\"listen_port\":{{ "{{PORT}}" }},\"current_network_interface\":\"{{ "{{VPN_INTERFACE}}" }}\",\"random_port\":false,\"upnp\":false}"
                http://127.0.0.1:8080/api/v2/app/setPreferences'
              # HTTP proxy through the tunnel, used by Prowlarr for indexers
              # blocked by the ISP (tag "vpn" in Prowlarr).
              HTTPPROXY: "on"
              HTTPPROXY_LISTENING_ADDRESS: ":8888"
              # WebUI and proxy reachable from the cluster (Radarr/Sonarr,
              # Envoy, probes, Prowlarr).
              FIREWALL_INPUT_PORTS: "8080,8888"
            envFrom:
              - secretRef:
                  name: qbittorrent-secret
            restartPolicy: Always
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
              capabilities: { add: ["NET_ADMIN"] }
            resources:
              requests:
                cpu: 10m
              limits:
                devic.es/tun: 1
                memory: 256Mi
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/qbittorrent
              tag: 5.2.4@sha256:9307627e03981d5473aa31175ea76ed56ea3752333ca49d601b6af45e281e7ba
            env:
              TZ: Europe/Copenhagen
              QBT_WEBUI_PORT: &port 8080
            probes:
              # TCP, not HTTP: the WebUI API answers 403 to unauthenticated
              # probes from the node.
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 6
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
              limits:
                memory: 4Gi
    defaultPodOptions:
      # Resolve through Gluetun's DNS inside the tunnel, so tracker lookups
      # never leak to the ISP or cluster DNS.
      dnsPolicy: None
      dnsConfig:
        nameservers: ["127.0.0.1"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 100000
        runAsGroup: 100000
        fsGroup: 100000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        # Real health check; see jellyfin for why the route isn't monitored.
        annotations:
          gatus.home-operations.com/enabled: "true"
          gatus.home-operations.com/endpoint: |-
            group: internal
            ui: { hide-hostname: true, hide-url: true }
            url: http://qbittorrent.media.svc.cluster.local:8080/
            conditions: ["[STATUS] == 200"]
        ports:
          http:
            port: *port
          proxy:
            port: 8888
    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: openebs-hostpath
        accessMode: ReadWriteOnce
        size: 1Gi
      media:
        existingClaim: media
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
