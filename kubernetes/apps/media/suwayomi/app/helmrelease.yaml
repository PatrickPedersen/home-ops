---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: suwayomi
spec:
  chartRef:
    kind: OCIRepository
    name: suwayomi
  interval: 1h
  values:
    controllers:
      suwayomi:
        containers:
          app:
            image:
              repository: ghcr.io/suwayomi/suwayomi-server
              tag: v2.4.2435@sha256:ca891c0a6915666d6a79f16b0119c52a63507d840e14dca0e8dbcc163f60d8b3
            env:
              TZ: Europe/Copenhagen
              BIND_PORT: &port 4567
              # Login is Authentik forward auth at the route; Mangarr uses the
              # service directly.
              AUTH_MODE: none
              FLARESOLVERR_ENABLED: "true"
              FLARESOLVERR_URL: http://flaresolverr.media.svc.cluster.local:8191
              EXTENSION_STORES: '["https://raw.githubusercontent.com/keiyoushi/extensions/repo/index.min.json"]'
              # Mangarr does its own checking; Suwayomi's library updater stays off.
              UPDATE_INTERVAL: "0"
              # Outbound traffic to sources via the shared VPN proxy
              # (network/gluetun). Cluster services stay direct.
              JAVA_TOOL_OPTIONS: >-
                -Dhttp.proxyHost=gluetun.network.svc.cluster.local -Dhttp.proxyPort=8888
                -Dhttps.proxyHost=gluetun.network.svc.cluster.local -Dhttps.proxyPort=8888
                -Dhttp.nonProxyHosts=localhost|127.*|*.cluster.local
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 6
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 30 # first boot downloads the web UI
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
              limits:
                memory: 2Gi
    defaultPodOptions:
      # The image's built-in user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    # Mangarr talks to the service directly; the route is for the web UI.
    service:
      app:
        # Real health check; see jellyfin for why the route isn't monitored.
        annotations:
          gatus.home-operations.com/enabled: "true"
          gatus.home-operations.com/endpoint: |-
            group: internal
            ui: { hide-hostname: true, hide-url: true }
            url: http://suwayomi.media.svc.cluster.local:4567/
            conditions: ["[STATUS] == 200"]
        ports:
          http:
            port: *port
    # AUTH_MODE none: Authentik forward auth guards it (media/forward-auth.yaml).
    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: openebs-hostpath
        accessMode: ReadWriteOnce
        size: 5Gi
        globalMounts:
          - path: /home/suwayomi/.local/share/Tachidesk
