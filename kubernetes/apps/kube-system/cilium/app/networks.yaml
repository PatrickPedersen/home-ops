---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: pool
spec:
  allowFirstLastIPs: "No"
  blocks:
    - cidr: "192.168.30.0/24"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
spec:
  loadBalancerIPs: true
  # Only announce LoadBalancer IPs (192.168.30.0/24) on the Kubernetes VLAN,
  # not on the storage bond.
  interfaces:
    - ^bond0$
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
