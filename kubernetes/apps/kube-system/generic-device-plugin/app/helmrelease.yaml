---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: generic-device-plugin
spec:
  chartRef:
    kind: OCIRepository
    name: generic-device-plugin
  interval: 1h
  values:
    defaultPodOptions:
      priorityClassName: system-node-critical
    controllers:
      generic-device-plugin:
        type: daemonset
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/squat/generic-device-plugin
              tag: latest@sha256:dc192e164c69b03f156765793a1be62ca437709ae477b27ca7d8f3dcf5021576
            # Exposes host devices as schedulable resources, so pods request
            # `squat.ai/dri` / `squat.ai/tun` instead of running privileged.
            args:
              - --log-level=info
              - --config=/config/config.yml
            ports:
              - name: http
                containerPort: 8080
            securityContext:
              privileged: true
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 64Mi
    configMaps:
      config:
        data:
          config.yml: |
            devices:
              - name: dri
                groups:
                  - count: 10
                    paths:
                      - path: /dev/dri
              - name: tun
                groups:
                  - count: 10
                    paths:
                      - path: /dev/net/tun
    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /config/config.yml
            subPath: config.yml
            readOnly: true
      # Must stay writable: the kubelet creates /dev/termination-log in it.
      dev:
        type: hostPath
        hostPath: /dev
      device-plugins:
        type: hostPath
        hostPath: /var/lib/kubelet/device-plugins
