---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
spec:
  chartRef:
    kind: OCIRepository
    name: openebs
  interval: 1h
  values:
    analytics:
      enabled: false
    localpv:
      # /var/mnt is already propagated into the Talos kubelet, so no
      # extra kubelet mounts are needed. Lives on the encrypted EPHEMERAL volume.
      basePath: /var/mnt/openebs/local
    hostpathClass:
      name: openebs-hostpath
      isDefaultClass: true
