---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  chartRef:
    kind: OCIRepository
    name: authentik
  interval: 1h
  values:
    global:
      # Explicit env wins over the chart's generated config secret, so the
      # empty secret_key/password placeholders below are never used.
      env:
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: AUTHENTIK_SECRET_KEY
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-pg-app # generated by CloudNativePG
              key: password
        - name: LDAP_BIND_PASSWORD # read by blueprints/ldap.yaml
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: LDAP_BIND_PASSWORD
    blueprints:
      configMaps: [authentik-blueprints]
    authentik:
      postgresql:
        host: authentik-pg-rw
        name: authentik
        user: authentik
    server:
      service:
        # Real health check; see jellyfin for why the route isn't monitored.
        annotations:
          gatus.home-operations.com/enabled: "true"
          gatus.home-operations.com/endpoint: |-
            name: authentik-server
            group: internal
            ui: { hide-hostname: true, hide-url: true }
            url: http://authentik-server.security.svc.cluster.local/-/health/live/
            conditions: ["[STATUS] == 200"]
      route:
        main:
          enabled: true
          annotations:
            gatus.home-operations.com/enabled: "false"
          hostnames:
            - auth.${SECRET_DOMAIN}
          parentRefs:
            - name: envoy-internal
              namespace: network
