---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-pg
spec:
  # ponytail: single instance, no backups yet; add barman-cloud to Backblaze before relying on it
  instances: 1
  # Single instance on a single node: a PDB would block every node drain.
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  storage:
    size: 5Gi
    storageClass: openebs-hostpath
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
