# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Domain-wide forward auth for apps without their own SSO (*arr). Envoy asks
# the embedded outpost on every request; see media/forward-auth.yaml.
version: 1
metadata:
  name: Forward auth
entries:
  - model: authentik_core.group
    id: media-admin
    identifiers: { name: media_admin }

  - model: authentik_providers_proxy.proxyprovider
    id: forward-auth-provider
    identifiers: { name: Forward auth }
    attrs:
      mode: forward_domain
      external_host: https://auth.patrickpedersen.tech
      cookie_domain: patrickpedersen.tech
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: hours=24
      # The apps' APIs check their own API key; lets Seerr, Prowlarr sync and
      # mobile apps keep working through the hostname.
      skip_path_regex: ^/api/.*
  - model: authentik_core.application
    id: forward-auth-app
    identifiers: { slug: forward-auth }
    attrs:
      name: Media admin
      provider: !KeyOf forward-auth-provider
      meta_launch_url: blank://blank
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf forward-auth-app
      group: !KeyOf media-admin
    attrs:
      order: 0

  - model: authentik_outposts.outpost
    identifiers: { managed: goauthentik.io/outposts/embedded }
    attrs:
      providers: [!KeyOf forward-auth-provider]
