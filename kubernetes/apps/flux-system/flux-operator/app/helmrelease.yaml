---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  chartRef:
    kind: OCIRepository
    name: flux-operator
  interval: 1h
  values:
    serviceMonitor:
      create: true
    web:
      config:
        authentication:
          type: Anonymous
          anonymous:
            username: flux
            groups:
              - flux-admin
      httpRoute:
        enabled: true
        annotations:
          # Checked by a static endpoint in gatus-sidecar's config instead;
          # this chart can't annotate its Service.
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - flux-operator.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
      networkPolicy:
        create: false
