---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: storage0
selector:
  match: mac(link.permanent_addr) == "58:47:ca:76:12:b7" # SFP port enp2s0f0np0
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: storage1
selector:
  match: mac(link.permanent_addr) == "58:47:ca:76:12:b8" # SFP port enp2s0f1np1
---
apiVersion: v1alpha1
kind: BondConfig
name: bond1
links:
  - storage0
  - storage1
bondMode: 802.3ad # LACP: needs a matching aggregate on the switch ports
# Without link monitoring a bounced link is never marked up again.
miimon: 100
updelay: 200
downdelay: 200
mtu: 9000
addresses:
  - address: 192.168.40.10/24
